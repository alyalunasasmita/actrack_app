<ion-header class="ion-no-border">
  <ion-toolbar class="custom-toolbar">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()" color="primary">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="evergreen-theme" [fullscreen]="true">
  <div class="main-container max-w-md mx-auto">
    
    <div class="hero-section">
      <h2 class="title">edit Password</h2>
    </div>


    <section class="form-container">
      
      <div class="input-group">
        <label>password lama</label>
        <div class="input-wrapper">
          <ion-input 
            [type]="showOldPassword ? 'text' : 'password'" 
            [(ngModel)]="old_password"
            placeholder="Enter current password">
          </ion-input>
          <ion-button fill="clear" (click)="toggleOldPassword()" class="toggle-btn">
            <ion-icon [name]="showOldPassword ? 'eye-outline' : 'eye-off-outline'"></ion-icon>
          </ion-button>
        </div>
      </div>

      <div class="input-group">
        <label>password baru</label>
        <div class="input-wrapper">
          <ion-input 
            [type]="showNewPassword ? 'text' : 'password'" 
            [(ngModel)]="new_password"
            (ionInput)="validateNewPassword()"
            placeholder="Enter new password">
          </ion-input>
          <ion-button fill="clear" (click)="toggleNewPassword()" class="toggle-btn">
            <ion-icon [name]="showNewPassword ? 'eye-outline' : 'eye-off-outline'"></ion-icon>
          </ion-button>
        </div>
        
        <div class="strength-meter" *ngIf="new_password">
          <div class="meter-bar" [class]="passwordStrength"></div>
          <span class="strength-text" [class]="strengthTextClass">{{ strengthText }}</span>
        </div>
        
        <div class="info-tip" *ngIf="!new_password">
          <ion-icon name="information-circle"></ion-icon>
          <span>Minimal 6 karakter </span>
        </div>
      </div>

      <div class="input-group">
        <label>Konfirmasi password baru</label>
        <div class="input-wrapper">
          <ion-input 
            [type]="showConfirmPassword ? 'text' : 'password'" 
            [(ngModel)]="new_password_confirmation"
            (ionInput)="validateConfirmPassword()"
            placeholder="Repeat new password">
          </ion-input>
          <ion-button fill="clear" (click)="toggleConfirmPassword()" class="toggle-btn">
            <ion-icon [name]="showConfirmPassword ? 'eye-outline' : 'eye-off-outline'"></ion-icon>
          </ion-button>
        </div>
        <p class="error-text" *ngIf="errorMessage && new_password_confirmation">{{ errorMessage }}</p>
      </div>

      <div class="action-section">
        <ion-button 
          expand="block" 
          class="update-btn" 
          (click)="updatePassword()"
          [disabled]="isSubmitting">
          <ion-spinner name="crescent" *ngIf="isSubmitting"></ion-spinner>
          <ion-icon name="lock-closed-outline" slot="start" *ngIf="!isSubmitting"></ion-icon>
          {{ isSubmitting ? 'Updating...' : 'Update Password' }}
        </ion-button>
      </div>

    </section>
  </div>
</ion-content>

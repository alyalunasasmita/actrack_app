<ion-content class="password-bg">
  <div class="clean-wrapper">
    <div class="password-container">
      
      <!-- Back Button -->
      <div class="back-container">
        <ion-icon name="arrow-back-outline" (click)="goBack()" class="back-icon"></ion-icon>
      </div>

      <!-- Password Header -->
      <div class="password-header">
        <div class="lock-container">
          <ion-icon name="lock-closed-outline" class="lock-icon"></ion-icon>
        </div>
        <h2>Ganti Password</h2>
        <p>Perbarui password akun Anda</p>
      </div>

      <!-- Password Form Card -->
      <div class="password-card">
        <ion-item lines="none" class="password-item">
          <ion-icon name="key-outline" slot="start" class="item-icon"></ion-icon>
          <ion-label position="floating" class="password-label">Password Lama</ion-label>
          <ion-input 
            [(ngModel)]="old_password" 
            [type]="showOldPassword ? 'text' : 'password'" 
            class="password-input">
          </ion-input>
          <ion-icon 
            slot="end" 
            [name]="showOldPassword ? 'eye-off-outline' : 'eye-outline'" 
            class="eye-icon" 
            (click)="toggleOldPassword()">
          </ion-icon>
        </ion-item>

        <ion-item lines="none" class="password-item">
          <ion-icon name="lock-closed-outline" slot="start" class="item-icon"></ion-icon>
          <ion-label position="floating" class="password-label">Password Baru</ion-label>
          <ion-input 
            [(ngModel)]="new_password" 
            [type]="showNewPassword ? 'text' : 'password'" 
            class="password-input"
            (ionInput)="validateNewPassword()">
          </ion-input>
          <ion-icon 
            slot="end" 
            [name]="showNewPassword ? 'eye-off-outline' : 'eye-outline'" 
            class="eye-icon" 
            (click)="toggleNewPassword()">
          </ion-icon>
        </ion-item>

        <!-- Password strength indicator -->
        <div class="password-strength" *ngIf="new_password && new_password.length > 0">
          <div class="strength-bar">
            <div class="strength-level" [class]="passwordStrength"></div>
          </div>
          <span class="strength-text" [class]="strengthTextClass">{{ strengthText }}</span>
        </div>

        <ion-item lines="none" class="password-item">
          <ion-icon name="checkmark-done-outline" slot="start" class="item-icon"></ion-icon>
          <ion-label position="floating" class="password-label">Konfirmasi Password</ion-label>
          <ion-input 
            [(ngModel)]="new_password_confirmation" 
            [type]="showConfirmPassword ? 'text' : 'password'" 
            class="password-input"
            (ionInput)="validateConfirmPassword()">
          </ion-input>
          <ion-icon 
            slot="end" 
            [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'" 
            class="eye-icon" 
            (click)="toggleConfirmPassword()">
          </ion-icon>
        </ion-item>

        <!-- Error Message -->
        <div class="error-message" *ngIf="errorMessage">
          <ion-icon name="alert-circle-outline" class="error-icon"></ion-icon>
          <span>{{ errorMessage }}</span>
        </div>

        <!-- Success Message -->
        <div class="success-message" *ngIf="successMessage">
          <ion-icon name="checkmark-circle-outline" class="success-icon"></ion-icon>
          <span>{{ successMessage }}</span>
        </div>

        <ion-button expand="block" class="update-password-btn" (click)="updatePassword()" [disabled]="isSubmitting">
          <ion-icon slot="start" [name]="isSubmitting ? 'hourglass-outline' : 'shield-outline'"></ion-icon>
          {{ isSubmitting ? 'Memproses...' : 'Update Password' }}
        </ion-button>
      </div>

    </div>
  </div>
</ion-content>

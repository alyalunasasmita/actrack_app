<ion-content [fullscreen]="true" class="forest-theme">

  <div class="main-container">
    <div class="nature-card ion-padding">
      <div class="header-section ion-text-center">
        <div class="icon-circle">
          <ion-icon name="leaf-outline" color="primary"></ion-icon>
        </div>
        <h1>Register</h1>
        <p>catat harimu bersama actrack.</p>
      </div>

      <form (ngSubmit)="register()" #registerForm="ngForm">
        
        <div class="input-group">
          <ion-label class="custom-label">Full Name</ion-label>
          <ion-item lines="none" class="custom-item">
            <ion-icon slot="start" name="person-outline"></ion-icon>
            <ion-input 
              name="fullName"
              type="text" 
              placeholder="Enter your full name"
              [(ngModel)]="name"
              required>
            </ion-input>
          </ion-item>
        </div>

        <div class="input-group">
          <ion-label class="custom-label">Username</ion-label>
          <ion-item lines="none" class="custom-item">
            <ion-icon slot="start" name="at-outline"></ion-icon>
            <ion-input 
              name="username"
              type="text" 
              placeholder="Choose a username"
              [(ngModel)]="username"
              required>
            </ion-input>
          </ion-item>
        </div>

        <div class="input-group">
          <ion-label class="custom-label">Password</ion-label>
          <ion-item lines="none" class="custom-item">
            <ion-icon slot="start" name="lock-closed-outline"></ion-icon>
            <ion-input 
              name="password"
              [type]="showPassword ? 'text' : 'password'" 
              placeholder="Create a secure password"
              [(ngModel)]="password"
              (ionInput)="validatePassword()"
              required>
            </ion-input>
            <ion-button slot="end" fill="clear" color="medium" (click)="togglePassword()" type="button">
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </ion-button>
          </ion-item>
        </div>

        <div class="error-message" *ngIf="passwordError">
          <ion-icon name="alert-circle-outline" class="error-icon"></ion-icon>
          <span>{{ passwordErrorMessage }}</span>
        </div>

        <div class="password-strength" *ngIf="password && password.length > 0">
          <div class="strength-bar">
            <div class="strength-level" [class]="passwordStrength"></div>
          </div>
          <span class="strength-text">{{ strengthText }}</span>
        </div>

        <ion-button 
          expand="block" 
          type="submit" 
          class="register-btn ion-margin-top" 
          mode="ios" 
          [disabled]="!isFormValid() || isLoading">
          
          <ion-spinner name="crescent" *ngIf="isLoading"></ion-spinner>
          
          <ng-container *ngIf="!isLoading">
            Register
            <ion-icon slot="end" name="rose-outline"></ion-icon>
          </ng-container>
        </ion-button>
      </form>

      <div class="ion-text-center ion-margin-top login-footer">
        <p>sudah memiliki akun? 
          <span class="login-link" (click)="goToLogin()">Log In</span>
        </p>
      </div>
    </div>
  </div>

  <div class="bg-blobs">
    <div class="blob primary-blob"></div>
    <div class="blob secondary-blob"></div>
  </div>
</ion-content>

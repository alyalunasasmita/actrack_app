<ion-content class="ion-padding">
  <div class="clean-wrapper">

    <div class="header-section">
      <div class="logo-circle">
        <img src="/assets/icon.png" class="custom-logo" alt="Logo">
      </div>
      <h1 class="main-title">Register</h1>
      <p class="sub-title">
        buat akun untuk mengatur jurnal keseharian kamu di actrack
      </p>
    </div>

    <!-- ✅ cuma SATU form-container -->
    <div class="form-container">

      <div class="input-group">
        <ion-label>Name</ion-label>
        <ion-item lines="none" class="custom-item">
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-input [(ngModel)]="name" placeholder="masukan nama kamu"></ion-input>
        </ion-item>
      </div>

      <div class="input-group">
        <ion-label>Username</ion-label>
        <ion-item lines="none" class="custom-item">
          <ion-icon name="person-circle-outline" slot="start"></ion-icon>
          <ion-input [(ngModel)]="username" placeholder="masukan username kamu"></ion-input>
        </ion-item>
      </div>

      <div class="input-group">
        <ion-label>Password</ion-label>
        <ion-item lines="none" class="custom-item">
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input
            [(ngModel)]="password"
            [type]="showPassword ? 'text' : 'password'"
            (ionInput)="validatePassword()"
            placeholder="masukan password kamu">
          </ion-input>
          <ion-icon
            [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
            slot="end"
            (click)="togglePassword()"
            class="toggle-pwd">
          </ion-icon>
        </ion-item>
      </div>

      <div class="error-message" *ngIf="passwordError">
        <ion-icon name="alert-circle-outline" class="error-icon"></ion-icon>
        <span>{{ passwordErrorMessage }}</span>
      </div>

      <div class="password-strength" *ngIf="password && password.length > 0">
        <div class="strength-bar">
          <div class="strength-level" [class]="passwordStrength"></div>
        </div>
        <span class="strength-text">{{ strengthText }}</span>
      </div>

      <ion-button expand="full"
        (click)="register()"
        class="register-button"
        [disabled]="!isFormValid() || isLoading">

        <ion-icon slot="start" name="person-add-outline"></ion-icon>
        <ion-spinner name="crescent" *ngIf="isLoading"></ion-spinner>
        <span *ngIf="!isLoading">Register</span>
      </ion-button>

    </div>

    <div class="footer-section">
      <p>sudah punya akun? <span (click)="goToLogin()">Log In</span></p>
    </div>

  </div>
</ion-content>

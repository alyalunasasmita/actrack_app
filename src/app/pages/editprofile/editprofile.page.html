<ion-header class="ion-no-border">
  <ion-toolbar class="custom-toolbar">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()" color="teal">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="evergreen-theme" [fullscreen]="true">
  <div class="main-container">
    <div class="profile-header">
      <h2 class="title">Edit Profile</h2>
      <p class="subtitle">Adjust your personal sanctuary details</p>
    </div>

    <section class="form-section">
      <div class="input-group">
        <label>Username</label>
        <div class="input-wrapper">
          <ion-icon name="at-outline"></ion-icon>
          <ion-input 
            type="text" 
            [(ngModel)]="profile.username" 
            placeholder="your_handle">
          </ion-input>
        </div>
      </div>

      <div class="input-group">
        <label>Name</label>
        <div class="input-wrapper">
          <ion-icon name="person-outline"></ion-icon>
          <ion-input 
            type="text" 
            [(ngModel)]="profile.name" 
            placeholder="Full Name">
          </ion-input>
        </div>
      </div>

    </section>
  </div>

  <ion-footer class="ion-no-border bg-transparent">
    <div class="button-container">
      <ion-button 
        expand="block" 
        class="save-btn" 
        (click)="updateProfile()"
        [disabled]="isSubmitting">
        <ion-spinner name="crescent" *ngIf="isSubmitting"></ion-spinner>
        <ion-icon name="checkmark-circle-outline" slot="start" *ngIf="!isSubmitting"></ion-icon>
        {{ isSubmitting ? 'Saving...' : 'Save Changes' }}
      </ion-button>
    </div>
  </ion-footer>
</ion-content>

<ion-content [fullscreen]="true" class="evergreen-theme">
  <main class="main-content" *ngIf="progress">
    <section class="streak-header">
      <div class="badge-journey">
        <ion-icon name="leaf" class="primary-icon"></ion-icon>
        <span>GROWTH JOURNEY</span>
      </div>
      <h2 class="streak-title">{{ progress.streak }} Day Streak</h2>
      <p class="streak-subtitle">{{ getPlantMessage() }}</p>
    </section>

    <div class="plant-stage-container">
      <div class="glow-effect"></div>
      
      <div class="plant-card" [ngClass]="getPlantSizeClass()">
        <img [src]="plantImage" 
             [alt]="progress.status" 
             class="plant-img" 
             [ngClass]="getPlantAnimationClass()">
        
      </div>
    </div>

    <section class="progress-card">
      <div class="card-header">
        <div class="text-group">
          <h3>{{ getPlantGreeting() }}</h3>
          <p>{{ getTip() }}</p>
        </div>
        <div class="percentage-box">
          <span class="pct">{{ progress.growth }}%</span>
        </div>
      </div>

      <div class="progress-track">
        <div class="progress-fill" [style.width.%]="progress.growth"></div>
      </div>
    </section>

    <div class="bento-grid">
      <div class="stat-box">
        <ion-icon [name]="getStatusIcon()" [class]="getStatusClass()"></ion-icon>
        <span class="stat-label">STATUS</span>
        <span class="stat-value">{{ progress.status | uppercase }}</span>
      </div>
    </div>
  </main>

  <ion-modal [isOpen]="isHelpOpen" (didDismiss)="closeHelp()">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-title>Plant Care Guide</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="closeHelp()">Close</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <p>Keep your plant healthy by completing worklogs daily!</p>
      </ion-content>
    </ng-template>
  </ion-modal>

  <div class="organic-bg">
    <div class="blob b-1"></div>
    <div class="blob b-2"></div>
  </div>
</ion-content>

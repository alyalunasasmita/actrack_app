<ion-content [fullscreen]="true" class="evergreen-theme">

  <main class="main-content">
    <section class="chart-section">
      <div class="glass-card">
        <div class="card-header">
          <h2 class="title">insight</h2>
          <div class="date-badge">
            <span>7 hari terakhir</span>
            <ion-icon name="calendar-outline"></ion-icon>
          </div>
        </div>

        <div class="chart-container">
          <canvas #myChart></canvas>
        </div>

        <div class="chart-footer">
          <p>
            kamu telah menyelesaikan <span class="highlight">{{ totalTasks }} tugas</span> 
            dari {{ totalWorklogs }} worklog.
          </p>
        </div>
      </div>
    </section>

    <section class="stats-grid">
      <div class="stat-card primary">
        <div class="top-row">
          <ion-icon name="checkbox-outline" class="main-icon"></ion-icon>
          <span class="badge">Total</span>
        </div>
        <div class="bottom-row">
          <h4 class="value">{{ totalTasks }}</h4>
          <p class="label">TASKS COMPLET</p>
        </div>
      </div>

      <div class="stat-card surface">
        <div class="top-row">
          <ion-icon name="analytics-outline" class="main-icon secondary"></ion-icon>
          <span class="badge">Worklogs</span>
        </div>
        <div class="bottom-row">
          <h4 class="value text-dark">{{ totalWorklogs }}</h4>
          <p class="label text-muted">TOTAL SESI</p>
        </div>
      </div>

      <div class="stat-card secondary">
        <div class="top-row">
          <ion-icon name="star-outline" class="main-icon"></ion-icon>
          <span class="badge">puncak</span>
        </div>
        <div class="bottom-row">
          <h4 class="value truncate">{{ bestDay ? (bestDay | date:'EEEE') : '-' }}</h4>
          <p class="label">hari productive terbaik</p>
        </div>
      </div>
    </section>
  </main>
</ion-content>

<ion-content [fullscreen]="true" class="evergreen-theme">

  <main class="main-content">
    <section class="profile-hero" *ngIf="profile">
      <div class="info-group">
        <h1 class="user-name">{{ profile.name }}</h1>
        <p class="user-handle">@{{ profile.username || 'user' }}</p>
      </div>

      <ion-button 
        fill="outline" 
        class="settings-btn" 
        (click)="openMenu($event)">
        <ion-icon slot="start" name="settings-outline"></ion-icon>
        Account Settings
      </ion-button>
    </section>

    <div class="nature-decoration">
      <ion-icon name="leaf-outline"></ion-icon>
    </div>

    <section class="profile-hero" *ngIf="!profile">
      <ion-skeleton-text [animated]="true" style="width: 60%; height: 32px; margin: 0 auto;"></ion-skeleton-text>
      <ion-skeleton-text [animated]="true" style="width: 30%; height: 20px; margin: 12px auto 32px;"></ion-skeleton-text>
      <ion-skeleton-text [animated]="true" style="width: 50%; height: 48px; border-radius: 99px; margin: 0 auto;"></ion-skeleton-text>
    </section>
  </main>

  <div class="organic-bg">
    <div class="blob b-1"></div>
  </div>
</ion-content>

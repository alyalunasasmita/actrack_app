<ion-content [fullscreen]="true" class="edit-worklog-container">
  <main class="main-wrapper">
    
    <div class="navigation-header">
      <div class="back-link" (click)="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon>
        <span>Back to Sprout</span>
      </div>
    </div>

    <div class="form-card" *ngIf="form; else loadingState">
      
      <div class="decorative-icon">
        <ion-icon name="leaf-outline"></ion-icon>
      </div>

      <header class="form-header">
        <h1>Edit Worklog</h1>
        <p>Adjust the details of your growth session.</p>
      </header>

      <div class="form-body">
        
        <div class="input-group">
          <label for="activity">Activity Name</label>
          <div class="input-wrapper">
            <ion-icon name="business-outline" class="prefix-icon"></ion-icon>
            <input 
              id="activity" 
              type="text" 
              [(ngModel)]="form.activity" 
              placeholder="Deep Forest Focus">
          </div>
        </div>

        <div class="input-group">
          <label for="date">Date</label>
          <div class="input-wrapper">
            <ion-icon name="calendar-outline" class="prefix-icon"></ion-icon>
            <input 
              id="date" 
              type="date" 
              [(ngModel)]="form.date">
          </div>
        </div>

        <div class="row-grid">
          <div class="input-group">
            <label for="start_time">Start Time</label>
            <div class="input-wrapper">
              <ion-icon name="time-outline" class="prefix-icon"></ion-icon>
              <input 
                id="start_time" 
                type="time" 
                [(ngModel)]="form.start">
            </div>
          </div>

          <div class="input-group">
            <label for="end_time">End Time</label>
            <div class="input-wrapper">
              <ion-icon name="stopwatch-outline" class="prefix-icon"></ion-icon>
              <input 
                id="end_time" 
                type="time" 
                [(ngModel)]="form.end">
            </div>
          </div>
        </div>

        <div class="input-group">
          <label for="task_count">Task Count</label>
          <div class="input-wrapper">
            <ion-icon name="list-outline" class="prefix-icon"></ion-icon>
            <input 
              id="task_count" 
              type="number" 
              [(ngModel)]="form.task_count">
          </div>
        </div>

        <div class="input-group">
          <label for="notes">Notes</label>
          <div class="input-wrapper align-top">
            <ion-icon name="document-text-outline" class="prefix-icon"></ion-icon>
            <textarea 
              id="notes" 
              rows="4" 
              [(ngModel)]="form.notes"
              placeholder="Add your reflections here..."></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn-update" (click)="confirmEdit()" [disabled]="isSubmitting">
            <span>{{ isSubmitting ? 'Updating...' : 'Update' }}</span>
            <ion-icon name="checkmark-circle-outline"></ion-icon>
          </button>
          <button class="btn-cancel" (click)="goBack()">Cancel</button>
        </div>

      </div>
    </div>

    <ng-template #loadingState>
      <div class="loading-container">
        <ion-spinner name="crescent"></ion-spinner>
        <p>Memuat data worklog...</p>
      </div>
    </ng-template>


  </main>
</ion-content>

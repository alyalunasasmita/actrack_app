<ion-content class="edit-bg" *ngIf="form">
  <div class="clean-wrapper">
    <div class="edit-container">
      
      <!-- Back Button -->
      <div class="back-container">
        <ion-icon name="arrow-back-outline" (click)="goBack()" class="back-icon"></ion-icon>
      </div>

      <!-- Edit Header -->
      <div class="edit-header">
        <div class="header-icon-container">
          <ion-icon name="create-outline" class="header-icon"></ion-icon>
        </div>
        <h2>Edit Worklog</h2>
        <p>Perbarui aktivitas pekerjaan Anda</p>
      </div>

      <!-- Edit Form Card -->
      <div class="edit-card">
        
        <!-- Date Field -->
        <ion-item lines="none" class="edit-item">
          <ion-icon name="calendar-outline" slot="start" class="item-icon"></ion-icon>
          <ion-label position="floating" class="edit-label">Tanggal</ion-label>
          <ion-datetime 
            presentation="date" 
            [(ngModel)]="form.date"
            class="edit-datetime"
            placeholder="Pilih tanggal">
          </ion-datetime>
        </ion-item>

        <!-- Time Start & End in one row -->
        <div class="time-row">
          <div class="time-col">
            <ion-item lines="none" class="edit-item">
              <ion-icon name="time-outline" slot="start" class="item-icon"></ion-icon>
              <ion-label position="floating" class="edit-label">Mulai</ion-label>
              <ion-datetime 
                presentation="time" 
                [(ngModel)]="form.start"
                class="edit-datetime"
                placeholder="--:--">
              </ion-datetime>
            </ion-item>
          </div>

          <div class="time-col">
            <ion-item lines="none" class="edit-item">
              <ion-icon name="time-outline" slot="start" class="item-icon"></ion-icon>
              <ion-label position="floating" class="edit-label">Selesai</ion-label>
              <ion-datetime 
                presentation="time" 
                [(ngModel)]="form.end"
                class="edit-datetime"
                placeholder="--:--">
              </ion-datetime>
            </ion-item>
          </div>
        </div>

        <!-- Activity Field -->
        <ion-item lines="none" class="edit-item">
          <ion-icon name="briefcase-outline" slot="start" class="item-icon"></ion-icon>
          <ion-label position="floating" class="edit-label">Aktivitas</ion-label>
          <ion-textarea 
            [(ngModel)]="form.activity" 
            class="edit-textarea" 
            placeholder="Masukkan aktivitas yang dilakukan" 
            rows="3">
          </ion-textarea>
        </ion-item>

        <!-- Task Count Field -->
        <ion-item lines="none" class="edit-item">
          <ion-icon name="checkbox-outline" slot="start" class="item-icon"></ion-icon>
          <ion-label position="floating" class="edit-label">Jumlah Tugas</ion-label>
          <ion-input 
            [(ngModel)]="form.task_count" 
            type="number" 
            class="edit-input" 
            placeholder="Masukkan jumlah tugas">
          </ion-input>
        </ion-item>

        <!-- Notes Field -->
        <ion-item lines="none" class="edit-item">
          <ion-icon name="create-outline" slot="start" class="item-icon"></ion-icon>
          <ion-label position="floating" class="edit-label">Catatan</ion-label>
          <ion-textarea 
            [(ngModel)]="form.notes" 
            class="edit-textarea" 
            placeholder="Tambahkan catatan (opsional)" 
            rows="4">
          </ion-textarea>
        </ion-item>

        <!-- Error Message -->
        <div class="error-message" *ngIf="errorMessage">
          <ion-icon name="alert-circle-outline" class="error-icon"></ion-icon>
          <span>{{ errorMessage }}</span>
        </div>

        <!-- Action Buttons -->
        <div class="button-group">
          <ion-button expand="block" class="update-btn" (click)="confirmEdit()" [disabled]="isSubmitting">
            <ion-icon slot="start" [name]="isSubmitting ? 'hourglass-outline' : 'save-outline'"></ion-icon>
            {{ isSubmitting ? 'Menyimpan...' : 'Update Worklog' }}
          </ion-button>

          <ion-button expand="block" fill="outline" class="cancel-btn" (click)="goBack()">
            <ion-icon slot="start" name="close-outline"></ion-icon>
            Batal
          </ion-button>
        </div>

      </div>

    </div>
  </div>
</ion-content>

<!-- Empty State -->
<ion-content class="edit-bg" *ngIf="!form">
  <div class="clean-wrapper">
    <div class="empty-state">
      <ion-icon name="document-text-outline" class="empty-icon"></ion-icon>
      <h3>Data Tidak Ditemukan</h3>
      <p>Worklog yang ingin diedit tidak tersedia</p>
      <ion-button class="back-btn" (click)="goBack()">
        <ion-icon slot="start" name="arrow-back-outline"></ion-icon>
        Kembali
      </ion-button>
    </div>
  </div>
</ion-content>

<ion-content [fullscreen]="true" class="forest-theme">


  <main class="content-wrapper">
        <div class="search-container">
      <div class="search-box">
        <ion-icon name="search-outline" class="search-icon"></ion-icon>
        <ion-input 
          placeholder="Search worklogs..." 
          [(ngModel)]="searchKeyword"
          (ionInput)="onSearch($event)"
          class="custom-input">
        </ion-input>
        <ion-button fill="clear" *ngIf="searchKeyword" (click)="clearSearch()">
          <ion-icon slot="icon-only" name="close-circle"></ion-icon>
        </ion-button>
      </div>
      
      <ion-button class="filter-btn" (click)="toggleDatePicker()">
        <ion-icon slot="icon-only" name="calendar-outline"></ion-icon>
      </ion-button>
    </div>

    <div class="date-picker-overlay" *ngIf="showDatePicker">
      <div class="date-picker-card">
        <ion-datetime 
          presentation="date" 
          [(ngModel)]="tempSelectedDate"
          (ionChange)="onDateChange($event)">
        </ion-datetime>
        <div class="picker-footer">
          <ion-button fill="clear" (click)="closeDatePicker()">Cancel</ion-button>
          <ion-button fill="solid" (click)="applyDateFilter()">Apply Filter</ion-button>
        </div>
      </div>
    </div>

    <div class="ion-text-center ion-padding" *ngIf="loading">
      <ion-spinner name="crescent" color="primary"></ion-spinner>
      <p class="text-outline">Growing your data...</p>
    </div>

    <div class="worklog-grid" *ngIf="!loading && worklogs.length > 0">
      <div 
        *ngFor="let item of worklogs; let i = index" 
        class="worklog-item"
        [class.featured]="i === 0"
        (click)="openDetail(item)">
        
        <div class="item-content">
          <h3 class="activity-title">{{ truncateText(item.activity, 40) }}</h3>
          <div class="item-meta">
            <span class="duration-badge">{{ item.task_count || 0 }} tasks</span>
            <span class="time-stamp">{{ item.date | date:'shortTime' }}</span>
          </div>
          <p class="notes" *ngIf="item.notes">{{ truncateText(item.notes, 60) }}</p>
        </div>
      </div>
    </div>

    <div class="empty-state" *ngIf="!loading && worklogs.length === 0">
      <ion-icon name="leaf-outline" class="empty-icon"></ion-icon>
      <h4>No entries found</h4>
      <p>Try adjusting your search or date filter.</p>
      <ion-button fill="outline" (click)="resetFilters()">Reset Filters</ion-button>
    </div>
  </main>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed" class="custom-fab">
    <ion-fab-button (click)="addWorklog()" color="primary">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
